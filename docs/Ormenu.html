<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Menu</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: #0a0a0c; color: #f4f4f5; }
:root { --color-text-primary: #f4f4f5; --color-text-secondary: #a1a1a5; --color-background-primary: #18181b; --color-background-secondary: #27272a; --color-border-secondary: #3f3f46; --color-border-tertiary: #27272a; --border-radius-lg: 12px; --border-radius-md: 8px; }
.menu-wrap { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
.restaurant-header { text-align: center; margin-bottom: 1.5rem; }
.restaurant-header h1 { font-size: 28px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 8px; }
.restaurant-header p { font-size: 14px; color: var(--color-text-secondary); }
.filter-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem; }
.filter-btn { padding: 8px 18px; font-size: 13px; border-radius: 999px; border: 1px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
.filter-btn:hover { background: var(--color-background-secondary); }
.filter-btn.active { background: #f59e0b; border-color: #f59e0b; color: #000; font-weight: 500; }
.carousel-wrapper { position: relative; overflow: hidden; margin: 20px 0; }
.carousel-track { display: flex; gap: 16px; transition: transform 0.35s cubic-bezier(.4,0,.2,1); will-change: transform; padding: 4px 2px; }
.card { flex: 0 0 200px; background: var(--color-background-primary); border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; transition: transform 0.2s; }
.card:hover { transform: translateY(-4px); }
.card-img { width: 100%; height: 140px; overflow: hidden; background: var(--color-background-secondary); display: flex; align-items: center; justify-content: center; font-size: 48px; }
.card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-body { padding: 12px; }
.card-category { font-size: 11px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.card-name { font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 4px; line-height: 1.3; }
.card-desc { font-size: 12px; color: var(--color-text-secondary); line-height: 1.4; margin-bottom: 10px; min-height: 36px; }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.card-price { font-size: 16px; font-weight: 600; color: #f59e0b; }
.add-btn { width: 32px; height: 32px; border-radius: 50%; background: #f59e0b; border: none; color: #000; font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.12s; font-weight: bold; }
.add-btn:hover { transform: scale(1.1); }
.add-btn.added { background: #10b981; font-size: 14px; }
.nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: var(--color-background-primary); border: 1px solid var(--color-border-secondary); color: var(--color-text-primary); font-size: 20px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.nav-btn:hover:not(:disabled) { background: var(--color-background-secondary); }
.nav-prev { left: 0; }
.nav-next { right: 0; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 18px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-border-secondary); transition: background 0.2s, width 0.2s; cursor: pointer; }
.dot.active { background: #f59e0b; width: 20px; border-radius: 4px; }
.cart-bar { display: flex; align-items: center; justify-content: space-between; background: var(--color-background-secondary); border: 1px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 14px 18px; margin-top: 24px; }
.cart-info { font-size: 13px; color: var(--color-text-secondary); }
.cart-total { font-size: 18px; font-weight: 600; color: #f59e0b; margin-top: 4px; }
.order-btn { padding: 10px 20px; background: #f59e0b; color: #000; border: none; border-radius: var(--border-radius-md); font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
.order-btn:hover { opacity: 0.9; }
.loading { text-align: center; padding: 60px 20px; color: var(--color-text-secondary); font-size: 14px; }
  </style>
</head>
<body>
<div class="menu-wrap">
  <div class="restaurant-header">
    <h1>&#127869;&#65039; Our Menu</h1>
    <p>Fresh ingredients, authentic flavours</p>
  </div>

  <div class="filter-bar" id="filters"></div>

  <div id="loading" class="loading">Loading menu...</div>

  <div id="menu-content" style="display:none">
    <div style="position: relative; padding: 0 44px;">
      <button class="nav-btn nav-prev" id="prev">&#8249;</button>
      <div class="carousel-wrapper" id="carousel-wrapper">
        <div class="carousel-track" id="track"></div>
      </div>
      <button class="nav-btn nav-next" id="next">&#8250;</button>
    </div>

    <div class="dots" id="dots"></div>

    <div class="cart-bar" id="cart-bar" style="display:none">
      <div>
        <div class="cart-info" id="cart-info">0 items</div>
        <div class="cart-total" id="cart-total">&#8377;0.00</div>
      </div>
      <button class="order-btn">View Order &#8599;</button>
    </div>
  </div>
</div>

<script>
var emojis = { Starters: '&#129367;', 'Main Course': '&#127835;', Drinks: '&#129380;', Desserts: '&#127854;' };

// Auto-detect server URL: if we are on the Vite dev server port, backend is on 5000
var SERVER_URL = (window.location.port === '5173' || window.location.port === '5174')
  ? 'http://localhost:5000'
  : window.location.origin.replace(window.location.port ? ':' + window.location.port : '', ':5000');

/**
 * Resolve an image value to a displayable URL.
 * Handles: full http/https URLs, base64 data URLs, and relative /uploads/ paths.
 */
function resolveImageUrl(image) {
  if (!image) return null;
  if (image.startsWith('http') || image.startsWith('data:')) return image;
  // relative path like /uploads/image-xxx.jpg
  return SERVER_URL + image;
}

var allItems = [];
var activeFilter = 'All';
var offset = 0;
var cart = {};
var VISIBLE = 3;

var track = document.getElementById('track');
var dotsEl = document.getElementById('dots');
var prevBtn = document.getElementById('prev');
var nextBtn = document.getElementById('next');
var filtersEl = document.getElementById('filters');

// Fetch live menu from API
function loadMenu() {
  var apiBase = SERVER_URL + '/api';
  fetch(apiBase + '/menu')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      allItems = Array.isArray(data) ? data.filter(function(i) { return i.isAvailable !== false; }) : [];
      document.getElementById('loading').style.display = 'none';
      document.getElementById('menu-content').style.display = 'block';
      var cats = ['All'];
      allItems.forEach(function(i) { if (cats.indexOf(i.category) === -1) cats.push(i.category); });
      renderFilters(cats);
      renderAll();
    })
    .catch(function(e) {
      console.warn('Failed to fetch from API:', e.message);
      // Fallback static data if API unavailable
      allItems = [
        { name: 'Butter Chicken', category: 'Main Course', price: 18.99, description: 'Tender chicken cooked in a rich, creamy tomato sauce.', image: 'https://images.unsplash.com/photo-1499619912507-3e894b0ecc44?auto=format&fit=crop&q=80&w=400' },
        { name: 'Vegetable Samosa', category: 'Starters', price: 6.99, description: 'Crispy pastry filled with spiced potatoes and peas.', image: 'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&q=80&w=400' },
        { name: 'Garlic Naan', category: 'Starters', price: 4.99, description: 'Freshly baked flatbread topped with garlic and butter.', image: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&q=80&w=400' },
        { name: 'Paneer Tikka Masala', category: 'Main Course', price: 15.99, description: 'Grilled cottage cheese cubes in a spiced gravy.', image: 'https://images.unsplash.com/photo-1565557623262-b51c2513a641?auto=format&fit=crop&q=80&w=400' },
        { name: 'Mango Lassi', category: 'Drinks', price: 5.99, description: 'Sweet and creamy yogurt drink blended with ripe mangoes.', image: 'https://images.unsplash.com/photo-1589985643453-cd79f36ac00b?auto=format&fit=crop&q=80&w=400' },
        { name: 'Gulab Jamun', category: 'Desserts', price: 7.99, description: 'Deep-fried milk dumplings soaked in sugar syrup.', image: 'https://images.unsplash.com/photo-1488477181946-6428a0291840?auto=format&fit=crop&q=80&w=400' }
      ];
      document.getElementById('loading').style.display = 'none';
      document.getElementById('menu-content').style.display = 'block';
      var cats = ['All'];
      allItems.forEach(function(i) { if (cats.indexOf(i.category) === -1) cats.push(i.category); });
      renderFilters(cats);
      renderAll();
    });
}

function filteredItems() {
  return activeFilter === 'All' ? allItems : allItems.filter(function(i) { return i.category === activeFilter; });
}

function maxOffset(items) {
  return Math.max(0, items.length - VISIBLE);
}

function renderFilters(categories) {
  filtersEl.innerHTML = '';
  categories.forEach(function(cat) {
    var b = document.createElement('button');
    b.className = 'filter-btn' + (cat === activeFilter ? ' active' : '');
    b.textContent = cat;
    b.onclick = function() { activeFilter = cat; offset = 0; renderAll(); };
    filtersEl.appendChild(b);
  });
}

function renderCards() {
  var items = filteredItems();
  track.innerHTML = '';
  items.forEach(function(item, idx) {
    var inCart = cart[item.name] || 0;
    var card = document.createElement('div');
    card.className = 'card';
    var imageUrl = resolveImageUrl(item.image);
    var imgHtml = imageUrl
      ? '<img src="' + imageUrl + '" alt="' + item.name + '" style="width:100%;height:140px;object-fit:cover;display:block;">'
      : '<div style="width:100%;height:140px;display:flex;align-items:center;justify-content:center;font-size:48px;">&#127869;</div>';
    card.innerHTML =
      '<div class="card-img" style="padding:0;">' + imgHtml + '</div>' +
      '<div class="card-body">' +
        '<div class="card-category">' + item.category + '</div>' +
        '<div class="card-name">' + item.name + '</div>' +
        '<div class="card-desc">' + (item.description || '') + '</div>' +
        '<div class="card-footer">' +
          '<span class="card-price">&#8377;' + Number(item.price).toFixed(2) + '</span>' +
          '<button class="add-btn' + (inCart > 0 ? ' added' : '') + '" data-idx="' + idx + '" title="Add to order">' + (inCart > 0 ? inCart : '+') + '</button>' +
        '</div>' +
      '</div>';
    track.appendChild(card);
  });
  track.querySelectorAll('.add-btn').forEach(function(btn) {
    btn.onclick = function() {
      var i = filteredItems()[+btn.dataset.idx];
      cart[i.name] = (cart[i.name] || 0) + 1;
      renderCards();
      updateCart();
      applyOffset(true);
    };
  });
  applyOffset(false);
  renderDots(items);
}

function applyOffset(animate) {
  var cardWidth = 200 + 16;
  if (!animate) track.style.transition = 'none';
  track.style.transform = 'translateX(-' + (offset * cardWidth) + 'px)';
  if (!animate) setTimeout(function() { track.style.transition = ''; }, 10);
  prevBtn.disabled = offset === 0;
  nextBtn.disabled = offset >= maxOffset(filteredItems());
}

function renderDots(items) {
  dotsEl.innerHTML = '';
  var total = Math.max(1, items.length - VISIBLE + 1);
  for (var i = 0; i < total; i++) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === offset ? ' active' : '');
    (function(idx) {
      d.onclick = function() { offset = idx; renderCards(); };
    })(i);
    dotsEl.appendChild(d);
  }
}

function updateCart() {
  var total = 0;
  var count = 0;
  Object.keys(cart).forEach(function(name) {
    var qty = cart[name];
    var item = allItems.find(function(i) { return i.name === name; });
    if (item) total += item.price * qty;
    count += qty;
  });
  var bar = document.getElementById('cart-bar');
  if (count > 0) {
    bar.style.display = 'flex';
    document.getElementById('cart-info').textContent = count + ' item' + (count !== 1 ? 's' : '');
    document.getElementById('cart-total').textContent = '&#8377;' + total.toFixed(2);
  } else {
    bar.style.display = 'none';
  }
}

function renderAll() {
  renderCards();
}

prevBtn.onclick = function() { if (offset > 0) { offset--; applyOffset(true); renderDots(filteredItems()); } };
nextBtn.onclick = function() { if (offset < maxOffset(filteredItems())) { offset++; applyOffset(true); renderDots(filteredItems()); } };

loadMenu();
</script>
</body>
</html>
